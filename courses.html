    <style>
        /* ✅ Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f9fa;
            text-align: center;
            padding: 0;
            margin: 0;
        }

        /* ✅ Header */
        header {
            background: #378ecc;
            color: white;
            padding: 20px;
            font-size: 38px;
            font-weight: bold;
            text-align: center;
        }

        /* ✅ Back Button */
        .back-btn {
            display: inline-block;
            margin: 20px auto;
            padding: 12px 20px;
            background-color: #378ecc;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .back-btn:hover {
            background-color: #cc7a00;
        }

        /* ✅ Courses Container */
        #courses-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; /* ✅ Center Position */
            align-items: center;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        /* ✅ Course Card */
        .course-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 15px;
            text-align: left;
            transition: transform 0.3s ease-in-out;
            width: 320px; /* ✅ Fixed Width for Consistency */
        }

        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .course-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .course-content {
            padding: 15px;
        }

        .course-content h3 {
            font-size: 20px;
            color: #333;
            margin-bottom: 8px;
        }

        .course-content p {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .course-content a {
            display: inline-block;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .course-content a:hover {
            background: #0056b3;
        }

        /* ✅ Responsive Design */
        @media (max-width: 768px) {
            #courses-container {
                flex-direction: column;
                align-items: center;
            }

            .course-card {
                width: 90%;
            }

            .course-content h3 {
                font-size: 18px;
            }

            .course-content p {
                font-size: 12px;
            }

            .course-content a {
                font-size: 12px;
            }
        }
    </style>
</head>
